# Alacritty Terminal - Tokyo Night Theme

[general]
live_config_reload = true

[window]
decorations = "none"    # Borderless window
opacity = 0.80          # 80% transparency
dynamic_title = true    # Update title with running program
padding = { x = 10, y = 8 }

[font]
size = 8.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[cursor]
blink_interval = 600
thickness = 0.15
[cursor.style]
shape = "Beam"
blinking = "On"

[scrolling]
history = 10000

# Tokyo Night Color Scheme
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
text = "#1a1b26"
cursor = "#bb9af7"

[colors.selection]
text = "#ffffff"
background = "#364a82"

[colors.normal]
black   = "#32344a"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"    # Primary accent color
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[colors.bright]
black   = "#444b6a"
red     = "#ff7a93"
green   = "#b9f27c"
yellow  = "#ff9e64"
blue    = "#82aaff"
magenta = "#c099ff"
cyan    = "#89ddff"
white   = "#d5dcf5"
