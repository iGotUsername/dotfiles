[general]
live_config_reload = true

[window]
decorations = "none"
opacity = 0.75
dynamic_title = true
padding = { x = 10, y = 8 }

[font]
size = 8.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[cursor]
blink_interval = 600
thickness = 0.15
[cursor.style]
shape = "Beam"
blinking = "On"

[scrolling]
history = 10000

# Tokyo Night — ULTRA VIBRANT for transparency
[colors.primary]
background = "#1a1b26"
foreground = "#e0e8ff"  # Brighter foreground

[colors.cursor]
text = "#1a1b26"
cursor = "#00ffff"  # Bright cyan cursor

[colors.selection]
text = "#ffffff"
background = "#2b325c"

[colors.normal]
black   = "#2d3142"    # Lighter black for visibility
red     = "#ff5370"    # Neon red
green   = "#00ff9f"    # Electric green
yellow  = "#ffd700"    # Gold yellow
blue    = "#00b4ff"    # Electric blue
magenta = "#d896ff"    # Bright magenta
cyan    = "#00e5ff"    # Neon cyan
white   = "#f0f0f0"    # Bright white

[colors.bright]
black   = "#5a6a8a"    # Much lighter gray
red     = "#ff6e96"    # Hot pink red
green   = "#5fff87"    # Lime green
yellow  = "#ffda6b"    # Bright gold
blue    = "#50c8ff"    # Sky blue
magenta = "#e196ff"    # Lavender purple
cyan    = "#50fafa"    # Aqua cyan
white   = "#ffffff"    # Pure white

# Extra vibrant dim colors
[colors.dim]
black   = "#252736"
red     = "#e84f6f"
green   = "#00d787"
yellow  = "#e5b567"
blue    = "#32a4e7"
magenta = "#c080ff"
cyan    = "#00d0e5"
white   = "#d0d5e0"
