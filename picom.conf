# Backend & Performance
backend = "xrender";
vsync = true;
use-damage = true;
log-level = "warn";

# Window Animations
animations = true;
animation-stiffness = 200;
animation-window-mass = 0.5;
animation-dampening = 20;
animation-clamping = false;

animation-for-open-window = "zoom";
animation-for-unmap-window = "slide-down";
animation-for-menu-window = "slide-up";
animation-for-transient-window = "slide-down";

# Rounded Corners
corner-radius = 8;
round-borders = 1;  # Anti-alias rounded corners

rounded-corners-exclude = [
  "window_type = 'desktop'"
];

# Shadows
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.7;
shadow-offset-x = -15;
shadow-offset-y = -15;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "_GTK_FRAME_EXTENTS@",
  "class_g = 'dmenu'"
];

shadow-ignore-shaped = false;

# Window Type-Specific Settings
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = true; clip-shadow-above = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
};

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Opacity Rules
inactive-opacity = 0.85;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'firefox'",  # Firefox always opaque
  "85:!focused"               # Unfocused windows at 85%
];

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'"
];
