[general]
live_config_reload = true

[window]
decorations = "none"
opacity = 0.85
dynamic_title = true
padding = { x = 10, y = 8 }

[font]
size = 8.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[cursor]
blink_interval = 600
thickness = 0.15
[cursor.style]
shape = "Beam"
blinking = "On"

[scrolling]
history = 10000

# Tokyo Night — PERFECTLY SYNERGIZED
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"  # Matches the blue family

[colors.cursor]
text = "#1a1b26"
cursor = "#bb9af7"  # Purple - complementary to blue

[colors.selection]
text = "#ffffff"
background = "#364a82"  # Blue-tinted selection

[colors.normal]
black   = "#32344a"    
red     = "#f7768e"    # Pink-red (complementary to blue-green)
green   = "#9ece6a"    # Yellow-green (warm balance)
yellow  = "#e0af68"    # Warm gold (contrast to cool blues)
blue    = "#7aa2f7"    # YOUR ANCHOR COLOR ⭐
magenta = "#bb9af7"    # Purple (analogous to blue)
cyan    = "#7dcfff"    # Light cyan (analogous to blue)
white   = "#c0caf5"    # Lavender (blue family)

[colors.bright]
black   = "#444b6a"    # Blue-gray
red     = "#ff7a93"    # Brighter pink
green   = "#b9f27c"    # Brighter yellow-green
yellow  = "#ff9e64"    # Brighter orange-gold
blue    = "#82aaff"    # Brighter blue (same hue family)
magenta = "#c099ff"    # Brighter purple
cyan    = "#89ddff"    # Brighter cyan
white   = "#d5dcf5"    # Brighter lavender
